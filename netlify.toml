# Netlify continuous deployment config for the Four Seasons Order PWA.
#
# No build step — the repo root is published as-is (vanilla HTML/CSS/JS).
# Connect this repo in Netlify (Add new site → Import from Git → pick
# bleefis/picksheet) with:
#   Build command:   (leave empty)
#   Publish directory: .
# After that, every push to main auto-deploys to production, and every
# pull request gets its own Deploy Preview URL for testing.

[build]
  publish = "."

# Service worker + entry HTML must never be served stale, otherwise phones
# keep running the old app version after an update.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons change rarely — cache them hard for fast installs.
[[headers]]
  for = "/icon*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Server functions: send-order (email + start the cart robot), check-now
# (start a Four Seasons check), order-report (the robot's summary email),
# price-report (the Monday email), and morning, which runs on a timer
# (Netlify's, which starts on time, unlike GitHub's): it starts the morning
# price check and sends the 10 AM warning email. They need GMAIL_USER,
# GMAIL_APP_PASSWORD and GITHUB_TOKEN in Netlify's environment settings.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
