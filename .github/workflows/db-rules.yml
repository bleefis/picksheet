# One-off on this branch only: print the product list so it can be saved as a backup file.
name: Update database rules
on:
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf https://picksheet-8b2a0-default-rtdb.firebaseio.com/products.json > p.json
          jq '.items | length' p.json
          echo "BACKUP-BEGIN"; base64 -w 0 < <(gzip -9c p.json); echo; echo "BACKUP-END"
