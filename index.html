<!DOCTYPE html>
<!--
================================================================================
  FOUR SEASONS ORDER — Weekly Produce & Dairy Pick Sheet PWA
================================================================================

  OVERVIEW
  --------
  A mobile-first Progressive Web App (PWA) used weekly at the grocery store
  to count case quantities for ordering. Walk the aisles, tap item circles to
  increment quantities, then email the completed order to yourself for upload
  to the distributor portal.

  The app is a single self-contained HTML file with no build step, no framework,
  and no backend. All state lives in the browser's localStorage.

  WORKFLOW
  --------
  1. Open app from phone home screen icon (installed as a PWA via Chrome).
  2. Page 1 — Seasonal Produce: tap circles to set quantities, tap Next.
  3. Page 2 — Produce List: same, tap Next.
  4. Page 3 — Meat & Dairy: same, tap "Email Order".
  5. Gmail opens with both order lists pasted in the body (plain text, CSV format).
     - Seasonal + Produce are one block (uploaded together in the portal).
     - Meat & Dairy is a separate block (uploaded separately in the portal).
  6. Quantities reset to zero automatically after emailing.

  INTERACTION — QUANTITY CIRCLES (right side of each row)
  -------------------------------------------------------
  • Tap once       → increment quantity by 1
  • Hold 1 second  → reset quantity to 0 (haptic vibration confirms)
  • Only the circle is a tap target — the rest of the row scrolls freely

  CONFIGURATION (gear icon, top-right)
  ------------------------------------
  • Edit item name and distributor Item ID inline
  • Drag the ≡ handle to reorder items within a section
  • "+ Add item" appends a new blank row
  • Trash icon deletes a row
  • Item IDs are OPTIONAL for Seasonal Produce (they change seasonally)
  • "Backup Config" downloads items + IDs as JSON — save this somewhere safe
  • "Restore Backup" imports a previously saved JSON backup
  • "Save config" commits changes; "Cancel" reverts to last saved state

  CSV / EMAIL FORMAT
  ------------------
  Each section outputs plain-text CSV in the email body:
    ItemID,Quantity,ItemName
    236006,3,Avocados
    8104,2,Bananas
    ...
  Items with quantity 0 are omitted. Blank ItemID = empty field (seasonal items).

  STORAGE KEYS (localStorage)
  ---------------------------
  • "order_items_v3" — JSON array of item config per section (names + IDs)
  • "order_qty_v2"   — JSON object of current quantities per section
  Bumping either version key causes the app to fall back to DEFAULTS on next load.

  DEPLOYMENT
  ----------
  Host as static files. Requires:
    index.html    — this file
    manifest.json — PWA manifest (name, icons, display:standalone)
    sw.js         — service worker for offline caching
    icon-192.png  — home screen icon (192×192)
    icon-512.png  — home screen icon (512×512)

  Deployed at: https://lucky-kashata-294072.netlify.app
  To update: replace index.html in the Netlify folder and re-drop on netlify.com/drop

  ADDING/CHANGING ITEMS
  ---------------------
  Option A (preferred): Use the in-app gear icon to edit, then tap "Backup Config"
    to save the JSON. This is portable and survives app code updates.
  Option B: Edit the DEFAULTS constant below directly, then bump KEY_ITEMS version
    (e.g. 'order_items_v4') so existing installs pick up the new defaults.

  EMAIL TARGET
  ------------
  hardcoded to: highlandrootsmkt@gmail.com
  To change: search "highlandrootsmkt" in this file and replace.

  DEPENDENCIES
  ------------
  • Google Fonts — DM Serif Display + DM Sans (loaded from fonts.googleapis.com)
  • No npm, no bundler, no framework. Vanilla HTML/CSS/JS only.

================================================================================
-->

<style>
/* ============================================================
   DESIGN TOKENS
   All colors, radii, and spacing defined as CSS variables.
   ============================================================ */
:root {
  --bg:         #f4f1ea;   /* warm off-white page background */
  --surface:    #ffffff;   /* card / panel background */
  --green:      #1e3a2f;   /* primary brand green (header, buttons) */
  --green-mid:  #2d5c45;
  --green-lt:   #e2efe8;   /* active badge fill */
  --green-dk:   #122418;   /* header progress bar background */
  --accent:     #4caf7d;   /* progress fill, hold ring, add-item text */
  --ink:        #1a1a18;   /* primary text */
  --muted:      #6b6960;   /* secondary text, placeholders */
  --border:     rgba(0,0,0,0.09);
  --border-md:  rgba(0,0,0,0.15);
  --danger:     #b03a2e;
  --radius:     14px;
  --radius-sm:  8px;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent; /* suppress blue flash on tap */
  overscroll-behavior: none;                /* prevent pull-to-refresh interfering */
}

/* ============================================================
   LAYOUT — full-height flex column with fixed header + footer
   ============================================================ */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  /* respect notch / home-bar safe areas on iPhone and Android */
  padding:
    env(safe-area-inset-top, 0px)
    env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  background: var(--green);
  padding: 16px 18px 14px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-shrink: 0;
}
.header-left h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  font-weight: 400;
  color: #fff;
  line-height: 1;
}
.header-left .sub {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  margin-top: 3px;
  letter-spacing: 0.04em;
}
/* Gear icon button — opens config page */
.icon-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  border-radius: 8px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: #fff;
  touch-action: manipulation;
}
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active { opacity: 0.6; }

/* ============================================================
   PROGRESS BAR (3 steps: Seasonal → Produce → Meat & Dairy)
   Hidden while config page is open.
   ============================================================ */
.progress-wrap { background: var(--green-dk); padding: 10px 18px; flex-shrink: 0; }
.progress-steps { display: flex; gap: 6px; align-items: center; }
.step { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); transition: background 0.3s; }
.step.done   { background: var(--accent); }
.step.active { background: rgba(255,255,255,0.7); }
.step-labels { display: flex; margin-top: 5px; }
.step-label  { flex: 1; font-size: 10px; color: rgba(255,255,255,0.5); text-align: center; letter-spacing: 0.03em; }
.step-label.active { color: rgba(255,255,255,0.9); font-weight: 600; }
.step-label.done   { color: var(--accent); }

/* ============================================================
   SCROLLABLE BODY — sits between fixed header and fixed footer
   ============================================================ */
.scroll-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 13px 110px; /* bottom padding clears the fixed footer */
  -webkit-overflow-scrolling: touch;
}

/* Section title card at top of each order page */
.section-intro { background: var(--green); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; color: #fff; }
.section-intro h2 { font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400; }
.section-intro p  { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 3px; }

/* ============================================================
   ITEM LIST ROWS
   Each row: [item name + ID] [hold-ring] [qty circle]
   Only the qty circle (badge) is a tap target — the row itself
   is NOT interactive so the user can scroll without triggering taps.
   ============================================================ */
.items-card { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); overflow: hidden; margin-bottom: 14px; }
.item-row   { display: flex; align-items: center; padding: 3px 8px 3px 14px; border-bottom: 0.5px solid var(--border); position: relative; min-height: 42px; }
.item-row:last-child { border-bottom: none; }

.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 14px; color: var(--ink); line-height: 1.2; pointer-events: none; user-select: none; }
.item-id   { font-size: 10px; color: var(--muted); margin-top: 1px; pointer-events: none; user-select: none; }

/* ── Quantity badge (the only tappable element per row) ── */
.qty-badge {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  touch-action: manipulation; /* removes 300ms tap delay without blocking scroll */
  user-select: none; -webkit-user-select: none;
  outline: 8px solid transparent; /* invisible extra tap padding */
  transition: background 0.12s, border-color 0.12s, transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
  background: #ece9e2;
  color: var(--muted);
  border: 1.5px solid transparent;
  flex-shrink: 0;
  position: relative;
}
.qty-badge.active { background: var(--green-lt); color: var(--green-dk); border-color: #9fcfb8; transform: scale(1.08); }
.qty-badge:active  { opacity: 0.7; }
.qty-badge.bump    { animation: bump 0.18s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes bump { 0%{transform:scale(1.08)} 50%{transform:scale(1.4)} 100%{transform:scale(1.08)} }

/* ── Hold-to-reset progress ring (animates over 0.9s on long-press) ── */
.hold-ring {
  position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
  width: 42px; height: 42px; border-radius: 50%;
  pointer-events: none; opacity: 0;
}
.hold-ring svg    { transform: rotate(-90deg); width: 42px; height: 42px; }
.hold-ring circle { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 118; stroke-dashoffset: 118; stroke-linecap: round; transition: none; }
.hold-ring.animating           { opacity: 1; }
.hold-ring.animating circle    { transition: stroke-dashoffset 0.9s linear; stroke-dashoffset: 0; }

/* ============================================================
   FIXED FOOTER — Back / Next / Email buttons
   ============================================================ */
.footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg);
  border-top: 0.5px solid var(--border-md);
  padding: 10px 13px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 9px;
  z-index: 5;
}
.btn {
  flex: 1; padding: 13px 10px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-md);
  background: var(--surface);
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity 0.1s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.btn:active   { opacity: 0.7; transform: scale(0.97); }
.btn.primary  { background: var(--green); border-color: var(--green); color: #fff; flex: 1.5; }
.btn.secondary{ color: var(--muted); }

/* ============================================================
   TOAST — brief confirmation message (bottom of screen)
   ============================================================ */
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--ink); color: #fff;
  font-size: 13px; font-weight: 500;
  padding: 8px 18px; border-radius: 999px;
  opacity: 0; transition: opacity 0.25s, transform 0.25s;
  pointer-events: none; white-space: nowrap; z-index: 20;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
   MODAL BOTTOM SHEET — confirmation dialogs
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 30; display: flex; align-items: flex-end; padding: 0;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn  { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }

.modal-sheet {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-height: 90dvh; overflow-y: auto;
  animation: slideUp 0.22s cubic-bezier(0.34,1.2,0.64,1);
}
.modal-sheet h2 { font-family: 'DM Serif Display', serif; font-size: 20px; font-weight: 400; margin-bottom: 6px; }
.modal-sheet p  { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 4px; }

.modal-btns { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
.modal-btns button {
  width: 100%; padding: 13px;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
  cursor: pointer; border: 1.5px solid var(--border-md); background: var(--surface); color: var(--ink);
  touch-action: manipulation;
}
.modal-btns button:active { opacity: 0.7; }
.m-primary { background: var(--green)!important; border-color: var(--green)!important; color: #fff!important; }
.m-danger  { color: var(--danger)!important; border-color: rgba(176,58,46,0.25)!important; }
.m-muted   { color: var(--muted)!important; }

/* ============================================================
   CONFIG PAGE — item editor with drag-to-reorder
   ============================================================ */
.config-wrap           { padding: 14px 13px calc(90px + env(safe-area-inset-bottom, 0px)); }
.config-section        { margin-bottom: 20px; }
.config-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.config-section-title  { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.add-btn               { font-size: 12px; font-weight: 600; color: var(--accent); background: none; border: none; cursor: pointer; padding: 4px 0; touch-action: manipulation; }

.config-card  { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); overflow: visible; }
.config-row   { display: flex; align-items: center; padding: 8px 10px; border-bottom: 0.5px solid var(--border); gap: 8px; }
.config-row:last-child { border-bottom: none; }

/* Drag handle — touch-action:none isolates it from scroll so pointer events fire */
.drag-handle     { color: var(--muted); flex-shrink: 0; cursor: grab; padding: 4px; touch-action: none; }
.drag-handle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.config-fields       { flex: 1; display: flex; gap: 6px; min-width: 0; }
.config-input        { border: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); outline: none; min-width: 0; }
.config-input.name-input { flex: 1.6; }
.config-input.id-input   { flex: 1; color: var(--muted); }
.config-input::placeholder { color: #c0bdb5; }

.delete-btn      { background: none; border: none; cursor: pointer; color: #c0bdb5; flex-shrink: 0; padding: 4px; touch-action: manipulation; }
.delete-btn svg  { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.delete-btn:active { color: var(--danger); }

/* Visual states during drag */
.config-row.is-dragging { opacity: 0.35; background: var(--green-lt); }
.drag-placeholder       { height: 42px; border: 2px dashed var(--accent); border-radius: 6px; background: rgba(76,175,125,0.07); margin: 2px 0; pointer-events: none; }

.config-hint { font-size: 11px; color: var(--muted); margin: 6px 2px 0; line-height: 1.5; }

/* Backup / Restore buttons at top of config page */
.backup-row { display: flex; gap: 8px; margin-bottom: 20px; }
.backup-btn {
  flex: 1; padding: 10px;
  border-radius: var(--radius-sm); border: 1.5px solid var(--border-md);
  background: var(--surface);
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  touch-action: manipulation;
}
.backup-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.backup-btn.export-cfg { color: var(--green); border-color: rgba(30,58,47,0.25); }
.backup-btn:active { opacity: 0.6; }
</style>
</head>

</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Modal bottom sheets rendered here -->
<div id="modal-root"></div>

function loadState() {
  try { const s = localStorage.getItem(KEY_ITEMS); if (s) items = JSON.parse(s); } catch(e) {}
  try { const s = localStorage.getItem(KEY_QTY);   if (s) qty   = JSON.parse(s); } catch(e) {}
  // Fill any missing sections with defaults
  SECTION_KEYS.forEach(k => {
    if (!items[k]) items[k] = JSON.parse(JSON.stringify(DEFAULTS[k]));
    if (!qty[k])   qty[k]   = {};
  });
}

function saveItems() {
  try { localStorage.setItem(KEY_ITEMS, JSON.stringify(items)); } catch(e) {}
}

function saveQty() {
  try { localStorage.setItem(KEY_QTY, JSON.stringify(qty)); } catch(e) {}
}

// Stable DOM IDs for badge and ring elements
function badgeId(sec, name) { return 'b_' + sec + '_' + name.replace(/\W/g, '_'); }
function ringId(sec, name)  { return 'r_' + sec + '_' + name.replace(/\W/g, '_'); }

function renderOrderPage() {
  const sec  = SECTION_KEYS[currentPage];
  const body = document.getElementById('main-body');
  body.innerHTML = '';

  // Section intro banner

  intro.className = 'section-intro';

  body.appendChild(intro);

  // Item list card
  const card = document.createElement('div');
  card.className = 'items-card';

  items[sec].forEach(item => {
    const row = document.createElement('div');

    // Left: item name + optional ID display

    ring.id = ringId(sec, item.name);
    ring.innerHTML = `<svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="17.8"/></svg>`;

    // Quantity badge — THE ONLY TAP TARGET in this row
    const badge = document.createElement('div');
    badge.className = 'qty-badge';
    badge.id = badgeId(sec, item.name);
    badge.setAttribute('role', 'button');
    badge.setAttribute('tabindex', '0');
    badge.setAttribute('aria-label', `${item.name}, tap to add, hold to reset`);
    const q = qty[sec][item.name] || 0;
    badge.textContent = q || '—';
    if (q > 0) badge.classList.add('active');

    row.appendChild(info);
    row.appendChild(ring);
    row.appendChild(badge);
    card.appendChild(row);

    attachBadgeInteraction(badge, ring, sec, item.name);
  });

  body.appendChild(card);
  renderFooter();
}

/**
 * Attaches tap-to-increment and hold-to-reset interaction to a badge element.
 * Touch events are passive on touchstart (allowing page scroll) but the tap
 * logic is cancelled if touchcancel fires (i.e. the user is scrolling).
 */
function attachBadgeInteraction(badge, ring, sec, name) {
  let holdTimer = null;
  let didHold   = false;

  function startPress() {
    didHold = false;
    ring.classList.add('animating');
    holdTimer = setTimeout(() => {
      didHold = true;
      qty[sec][name] = 0;
      refreshBadge(sec, name);
      saveQty();
      if (navigator.vibrate) navigator.vibrate(60); // haptic confirmation
      ring.classList.remove('animating');
    }, 900);
  }

  function cancelPress() {
    clearTimeout(holdTimer);
    ring.classList.remove('animating');
    didHold = false;
  }

  function endPress() {
    clearTimeout(holdTimer);
    ring.classList.remove('animating');
    if (!didHold) {
      qty[sec][name] = (qty[sec][name] || 0) + 1;
      refreshBadge(sec, name, true);
      saveQty();
    }
    didHold = false;
  }

  // Mouse (desktop/laptop)
  badge.addEventListener('mousedown',  startPress);
  badge.addEventListener('mouseup',    endPress);
  badge.addEventListener('mouseleave', cancelPress);

  // Touch — passive start allows browser to handle scroll gestures;
  // touchcancel fires automatically if the browser decides user is scrolling
  badge.addEventListener('touchstart',  () => startPress(),                         {passive: true});
  badge.addEventListener('touchend',    e  => { e.preventDefault(); endPress(); },  {passive: false});
  badge.addEventListener('touchcancel', cancelPress);

  // Keyboard accessibility
  badge.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      qty[sec][name] = (qty[sec][name] || 0) + 1;
      refreshBadge(sec, name, true);
      saveQty();
    }
  });
}

/** Update a single badge's text and visual state. bump=true triggers the scale animation. */
function refreshBadge(sec, name, bump) {
  const badge = document.getElementById(badgeId(sec, name));
  if (!badge) return;
  const q = qty[sec][name] || 0;
  badge.textContent = q || '—';
  badge.className   = 'qty-badge' + (q > 0 ? ' active' : '');
  if (bump && q > 0) {
    badge.classList.remove('bump');
    void badge.offsetWidth; // force reflow to re-trigger animation
    badge.classList.add('bump');
  }
}

/** Refresh every badge on the current page (e.g. after reset). */
function refreshAllBadges() {
  const sec = SECTION_KEYS[currentPage];
  items[sec].forEach(item => refreshBadge(sec, item.name));
}

// ============================================================
//  EXPORT — build order text and open Gmail via mailto
//
//  CSV format per line:  ItemID,Quantity,ItemName
//  Items with qty = 0 are excluded.
//  Blank ItemID is preserved as an empty field (seasonal items).
//
//  The mailto: URI is handled natively by Android — it opens the
//  Gmail app directly in compose mode with pre-filled recipient,
//  subject, and body. No backend required.
//
//  Two order blocks are sent in one email:
//    Block 1 — Seasonal + Produce  (uploaded together in the portal)
//    Block 2 — Meat & Dairy        (uploaded separately in the portal)
// ============================================================

function buildOrderText(sections) {
  const rows = ['ItemID,Quantity,ItemName'];
  sections.forEach(sec => {
    items[sec].forEach(item => {
      const q = qty[sec][item.name] || 0;
      if (q > 0) {
        const id   = (item.id   || '').replace(/,/g, '');
        const name = (item.name || '').replace(/,/g, ';');
        rows.push(`${id},${q},${name}`);
      }
    });
  });
  return rows.join('\n');
}

function dateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function showExportSheet() {
  const root = document.getElementById('modal-root');
  root.innerHTML = '';

  const date  = dateStr();
  const text1 = buildOrderText(['seasonal', 'produce']);
  const text2 = buildOrderText(['meat']);

  // Item counts for the summary line
  const totalSP   = ['seasonal','produce'].reduce((n, s) => n + Object.values(qty[s]).filter(v => v > 0).length, 0);
  const totalMeat = Object.values(qty['meat']).filter(v => v > 0).length;

  const bd    = document.createElement('div');
  bd.className = 'modal-backdrop';
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.innerHTML = `
    <h2>Email Order</h2>
    <p><strong>${totalSP}</strong> Seasonal/Produce item${totalSP !== 1 ? 's' : ''} &nbsp;·&nbsp; <strong>${totalMeat}</strong> Meat &amp; Dairy item${totalMeat !== 1 ? 's' : ''}</p>
    <p style="margin-top:8px;">Both order lists will be pasted into Gmail. Quantities reset after sending.</p>
    <div class="modal-btns">
      <button class="m-primary" id="m-send">Open Gmail</button>
      <button class="m-muted"   id="m-cancel">Cancel</button>
    </div>`;

  bd.appendChild(sheet);
  root.appendChild(bd);
  bd.addEventListener('click', e => { if (e.target === bd) root.innerHTML = ''; });
  document.getElementById('m-cancel').addEventListener('click', () => root.innerHTML = '');

  document.getElementById('m-send').addEventListener('click', () => {
    root.innerHTML = '';

    const subject = encodeURIComponent(`Four Seasons Order ${date}`);
    const body    = encodeURIComponent(
      `Four Seasons Order — ${date}\n\n` +
      `=== SEASONAL + PRODUCE ===\n${text1}\n\n` +
      `=== MEAT & DAIRY ===\n${text2}`
    );
    // mailto: is intercepted by Android and opens Gmail app natively
    window.location.href = `mailto:${ORDER_EMAIL}?subject=${subject}&body=${body}`;

    // Reset all quantities and return to page 1 after a brief delay
    // (delay lets the mailto: URI dispatch before the DOM re-renders)
    setTimeout(() => {
      SECTION_KEYS.forEach(k => { qty[k] = {}; });
      saveQty();
      currentPage = 0;
      renderProgress();
      renderOrderPage();
      showToast('Order emailed! Quantities reset.');
    }, 500);
  });
}

/** Build one editable row: [drag handle] [name input] [id input] [delete button] */
function makeConfigRow(sec, item, idx, card) {
  const row = document.createElement('div');
  row.className    = 'config-row';
  row.dataset.idx  = idx;
  row.dataset.sec  = sec;

  // Drag handle (≡ lines)
  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.setAttribute('aria-label', 'Drag to reorder');
  handle.innerHTML = `<svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/></svg>`;

  // Name + ID inputs
  const fields = document.createElement('div');
  fields.className = 'config-fields';

  const nameIn = document.createElement('input');
  nameIn.className   = 'config-input name-input';
  nameIn.placeholder = 'Item name';
  nameIn.value       = item.name;
  nameIn.addEventListener('input', () => { items[sec][idx].name = nameIn.value; });

  const idIn = document.createElement('input');
  idIn.className   = 'config-input id-input';
  idIn.placeholder = sec === 'seasonal' ? 'ID (optional)' : 'Item ID';
  idIn.value       = item.id;
  idIn.addEventListener('input', () => { items[sec][idx].id = idIn.value; });

  fields.appendChild(nameIn);
  fields.appendChild(idIn);

  // Delete button
  const delBtn = document.createElement('button');
  delBtn.className = 'delete-btn';
  delBtn.setAttribute('aria-label', 'Delete item');
  delBtn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
  delBtn.addEventListener('click', () => {
    items[sec].splice(idx, 1);
    renderConfigPage();
  });

  row.appendChild(handle);
  row.appendChild(fields);
  row.appendChild(delBtn);

  // Wire pointer-based drag-to-reorder on the handle
  setupDragHandle(handle, row, card, sec);

  return row;
}

/**
 * Pointer-event drag-to-reorder.
 * Uses touchstart/touchmove/touchend (mobile) and mousedown/mousemove/mouseup (desktop).
 * HTML5 draggable API was not used — it is unreliable on Android Chrome.
 *
 * On drag start: snapshot input values → create floating clone → insert dashed placeholder.
 * On drag move:  move clone, reposition placeholder to show insertion point.
 * On drag end:   splice items array at new index → re-render config page.
 */
function setupDragHandle(handle, dragRow, card, sec) {
  let clone       = null;
  let placeholder = null;
  let dragging    = false;
  let rowHeight   = 0;
  let startOffsetY = 0;

  function getRows() {
    return Array.from(card.querySelectorAll('.config-row'));
  }

  function startDrag(clientY, clientX) {
    dragging = true;
    const rect = dragRow.getBoundingClientRect();
    rowHeight    = rect.height;
    startOffsetY = clientY - rect.top;

    // Save live input values to state before DOM manipulation
    syncInputsToState(card, sec);

    // Dashed placeholder to show drop target
    placeholder = document.createElement('div');
    placeholder.className  = 'drag-placeholder';
    placeholder.style.height = rowHeight + 'px';
    dragRow.parentNode.insertBefore(placeholder, dragRow.nextSibling);

    // Floating clone that follows the finger/cursor
    clone = dragRow.cloneNode(true);
    Object.assign(clone.style, {
      position:   'fixed',
      left:        rect.left + 'px',
      top:         rect.top  + 'px',
      width:       rect.width + 'px',
      zIndex:      '999',
      boxShadow:   '0 8px 24px rgba(0,0,0,0.18)',
      borderRadius:'8px',
      background:  'var(--surface)',
      opacity:     '0.96',
      pointerEvents: 'none',
      transition:  'none'
    });
    document.body.appendChild(clone);
    dragRow.classList.add('is-dragging');
  }

  function moveDrag(clientY) {
    if (!dragging || !clone) return;
    clone.style.top = (clientY - startOffsetY) + 'px';

    // Find the row whose midpoint the dragged clone has crossed, then move placeholder
    const midY = clientY - startOffsetY + rowHeight / 2;
    let insertBefore = null;
    for (const r of getRows()) {
      if (r === dragRow) continue;
      const rRect = r.getBoundingClientRect();
      if (midY < rRect.top + rRect.height / 2) { insertBefore = r; break; }
    }
    if (insertBefore) card.insertBefore(placeholder, insertBefore);
    else              card.appendChild(placeholder);
  }

  function endDrag() {
    if (!dragging) return;
    dragging = false;

    const oldIdx = parseInt(dragRow.dataset.idx);

    // Determine new index by counting real rows before the placeholder
    const allChildren  = Array.from(card.children);
    const phPosition   = allChildren.indexOf(placeholder);
    const rowsBefore   = allChildren.slice(0, phPosition).filter(el => el.classList.contains('config-row')).length;
    const newIdx       = rowsBefore > oldIdx ? rowsBefore - 1 : rowsBefore;

    // Reorder in state
    const moved = items[sec].splice(oldIdx, 1)[0];
    items[sec].splice(newIdx, 0, moved);

    // Clean up DOM artifacts
    if (clone)       { clone.remove();       clone       = null; }
    if (placeholder) { placeholder.remove(); placeholder = null; }
    dragRow.classList.remove('is-dragging');

    renderConfigPage();
  }

  // Touch
  handle.addEventListener('touchstart',  e  => { startDrag(e.touches[0].clientY, e.touches[0].clientX); }, {passive: true});
  handle.addEventListener('touchmove',   e  => { e.preventDefault(); moveDrag(e.touches[0].clientY); },    {passive: false});
  handle.addEventListener('touchend',    () => endDrag(), {passive: true});
  handle.addEventListener('touchcancel', () => endDrag(), {passive: true});

  // Mouse
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    startDrag(e.clientY, e.clientX);
    const onMove = ev => moveDrag(ev.clientY);
    const onUp   = () => { endDrag(); window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
  });
}

/**
 * Read current input values from the DOM back into the items[] state.
 * Must be called before any DOM manipulation (e.g. drag start) that
 * might cause input values to be lost.
 */
function syncInputsToState(card, sec) {
  card.querySelectorAll('.config-row').forEach(row => {
    const idx    = parseInt(row.dataset.idx);
    if (isNaN(idx) || !items[sec][idx]) return;
    const nameIn = row.querySelector('.name-input');
    const idIn   = row.querySelector('.id-input');
    if (nameIn) items[sec][idx].name = nameIn.value;
    if (idIn)   items[sec][idx].id   = idIn.value;
  });
}


// ============================================================
//  CONFIG BACKUP & RESTORE
//  Backup downloads a JSON file containing all item names and IDs.
//  Restore loads a previously saved backup JSON.
//
//  IMPORTANT: Back up after any significant ID/name changes.
//  localStorage is device-specific and will be lost if the browser
//  cache is cleared or a new device is used.
// ============================================================

function exportConfig() {
  const json = JSON.stringify({version: 1, exportedAt: new Date().toISOString(), items}, null, 2);
  const url  = URL.createObjectURL(new Blob([json], {type: 'application/json'}));
  const a    = Object.assign(document.createElement('a'), {href: url, download: `order-config-backup-${dateStr()}.json`});
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast('Config backup downloaded');
}

function importConfig() {
  const input = Object.assign(document.createElement('input'), {type: 'file', accept: '.json,application/json'});
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.items || !parsed.items.seasonal) throw new Error('Invalid format');
        items = parsed.items;
        saveItems();
        renderConfigPage();
        showToast('Config restored ✓');
      } catch {
        showToast('Error: invalid backup file');
      }
    };
    reader.readAsText(file);
  });
  input.click();
}


// ============================================================
//  GEAR ICON — toggle between order pages and config page
// ============================================================
document.getElementById('config-btn').addEventListener('click', () => {
  showConfig = !showConfig;
  renderProgress();
  if (showConfig) renderConfigPage();
  else            renderOrderPage();
});


// ============================================================
//  SERVICE WORKER — enables offline use and home screen install
//  Caches index.html, manifest.json on first load.
//  See sw.js for cache strategy.
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}


// ============================================================
//  BOOT
// ============================================================
loadState();
renderProgress();
renderOrderPage();

</script>
