<!DOCTYPE html>
<!--
  FOUR SEASONS WEEKLY ORDER (picksheet)
  ------------------------------------------------------------
  Phone app for the weekly store walk. One list of products in store order;
  tap a circle to set cases (0-4), hold to clear. "Review & send" emails the
  order (a table split by account, CSVs attached) and starts the cart robot,
  which loads the Produce (94273) and Meat & Dairy (94274) carts on the
  Four Seasons portal. Nothing is ever submitted.

  Setup (gear) is the master product table, shared by every phone through
  Firebase /products. Each row is looked up by search words or an item #
  (digits only = item #). The 6 AM check (GitHub Actions, pricecheck/) saves
  this week's options and prices to Firebase /prices.

  Firebase paths:  /products  master table (open read/write)
                   /prices    written by the price check only
                   /orders    one record per Send; the robot writes progress
                   /order-config  old list, read once to build /products
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f3d2e"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Weekly Order</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
:root {
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #14201a;
  --muted: #647069;
  --line: #e3e8e4;
  --head: #0f3d2e;
  --accent: #2f9e5f;
  --accent-dk: #1d7a46;
  --accent-soft: #e2f4e9;
  --md: #7a4fd6;
  --md-soft: #efe8fd;
  --cheap: #f5c518;
  --warn-bg: #fff4d6;
  --warn-ink: #6b4f00;
  --danger: #b3261e;
  --danger-soft: #fdf0ef;
  --radius: 14px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.3; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, select { font: inherit; color: inherit; }

/* Header */
.hdr { position: sticky; top: 0; z-index: 20; background: var(--head); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 11px; display: flex; align-items: center; gap: 12px; }
.hdr-text { flex: 1; min-width: 0; }
.hdr-title { font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.hdr-sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-sub .ok { color: #9be3b9; }
.hdr-sub .old { color: #ffd27a; }
.hdr-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,0.12); color: #fff; font-weight: 700; font-size: 14px; }
.hdr-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

main { flex: 1; padding: 12px 12px 110px; width: 100%; max-width: 640px; margin: 0 auto; }
main.wide { max-width: none; padding: 0 0 40px; }

/* Order list */
.note { border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.info { background: var(--accent-soft); color: var(--accent-dk); display: flex; align-items: center; gap: 8px; }
.note.info button { margin-left: auto; font-weight: 700; text-decoration: underline; color: var(--accent-dk); }
.list { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; min-height: 54px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .nm { flex: 1; min-width: 0; user-select: none; }
.row .t { font-size: 15.5px; font-weight: 500; }
.row.fam .t { font-weight: 700; }
.row .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.row .s b.u { color: var(--ink); font-weight: 700; font-size: 13px; }
.row .s.go { color: var(--accent-dk); font-weight: 700; }
.row .s.bad { color: var(--danger); font-weight: 700; }
.row .s.na { font-style: italic; }
.row.fam { cursor: pointer; }
.row.fam.open { background: #f8fbf9; }
.row.var { padding-left: 28px; background: #fbfcfb; min-height: 50px; }
.row.var .t { font-size: 14px; }
.row.dim .t { color: var(--muted); }
.row.more { justify-content: center; color: var(--accent-dk); font-weight: 700; font-size: 14px; min-height: 44px; cursor: pointer; background: #fbfcfb; }
.chev { flex: none; color: var(--muted); font-size: 12px; }
.chip { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 999px; letter-spacing: 0.04em; vertical-align: 2px; margin-left: 6px; }
.chip.md { background: var(--md-soft); color: var(--md); }
.chip.cheap { background: var(--cheap); color: #3a2f00; }
.chip.ad { background: var(--accent-soft); color: var(--accent-dk); }
.pr { flex: none; min-width: 70px; text-align: right; font-weight: 700; font-size: 13.5px; }
.pr small { display: block; white-space: nowrap; font-weight: 500; color: var(--muted); font-size: 11.5px; }

/* Quantity circle: tap adds one (to 4, then back to 0), hold clears */
.qbox { position: relative; flex: none; width: 46px; height: 46px; display: grid; place-items: center; }
.q { width: 40px; height: 40px; border-radius: 50%; background: var(--line); color: var(--muted); display: grid; place-items: center; font-weight: 800; font-size: 17px; user-select: none; touch-action: manipulation; }
.q.on { background: var(--accent); color: #fff; }
.q.sum { background: transparent; border: 2px solid var(--line); font-size: 15px; }
.q.sum.on { border-color: var(--accent); color: var(--accent-dk); background: var(--accent-soft); }
.q.off { opacity: 0.35; }
.q.bump { animation: bump 0.18s ease; }
@keyframes bump { 50% { transform: scale(1.15); } }
.ring { position: absolute; inset: 0; pointer-events: none; }
.ring circle { fill: none; stroke: var(--danger); stroke-width: 3; stroke-dasharray: 132; stroke-dashoffset: 132; transform: rotate(-90deg); transform-origin: center; }
.ring.go circle { transition: stroke-dashoffset 0.9s linear; stroke-dashoffset: 0; }

/* Bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; }
.bar[hidden] { display: none; }
.bar-inner { width: 100%; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar .tot { flex: 1; font-size: 12.5px; color: var(--muted); }
.bar .tot b { display: block; font-size: 17px; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #fff; border-radius: 12px; padding: 0 18px; height: 48px; font-weight: 800; font-size: 15px; }
.btn:disabled { background: #b8c4bd; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.line { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.block { width: 100%; }

/* Sheets and dialogs */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10,20,15,0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
@media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.sheet .lead { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; }
.sheet .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.fine { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.sum-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sum-row:last-child { border-bottom: 0; }
.sum-row .nm { flex: 1; }
.sum-row b { font-weight: 800; }
.sum-row .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sum-row .pr { width: auto; font-size: 15px; }

/* Sent screen */
.step-row { display: flex; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
.step-row:last-child { border-bottom: 0; }
.step-row .ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--line); color: var(--muted); }
.step-row .ic.ok { background: var(--accent); color: #fff; }
.step-row .ic.bad { background: var(--danger); color: #fff; }
.step-row .ic.run { background: var(--accent-soft); color: var(--accent-dk); animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.step-row .nm { flex: 1; min-width: 0; }
.step-row b { font-weight: 800; }
.step-row .s { font-size: 13px; color: var(--muted); margin-top: 3px; }
.step-row .s li { margin-left: 18px; }
.step-row .s.bad { color: var(--danger); font-weight: 600; }

/* Setup table */
.desk-top { position: sticky; top: 63px; z-index: 15; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: #134a38; color: #fff; }
.desk-top .count { font-weight: 800; font-size: 16px; flex: 1; min-width: 140px; }
.desk-top .chk { font-size: 12.5px; color: rgba(255,255,255,0.8); }
.desk-top .chk.warn { color: #ffd38a; font-weight: 600; }
.desk-top .chk.fail { color: #3a2a00; background: #ffd38a; padding: 5px 10px; border-radius: 8px; font-weight: 700; }
.desk-top button { height: 34px; padding: 0 12px; border-radius: 9px; font-weight: 700; font-size: 13px; background: rgba(255,255,255,0.14); color: #fff; }
.desk-top button.add { background: var(--accent); }
.desk-top button:disabled { opacity: 0.6; cursor: default; }
.saved { font-size: 12.5px; color: #9be3b9; min-width: 70px; }
.desk-note { background: var(--warn-bg); color: var(--warn-ink); padding: 9px 14px; font-size: 13px; }
.desk-help { padding: 10px 14px; font-size: 13px; color: var(--muted); }
.scroll { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; min-width: 1020px; background: var(--card); font-size: 14px; }
.grid th { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); background: #f7f9f7; font-weight: 700; white-space: nowrap; }
.grid td { padding: 7px 8px; border-bottom: 1px solid #eef1ef; vertical-align: top; }
.grid tr.hiddenrow td { background: #f6f7f6; }
.grid tr.hiddenrow input.cell { color: var(--muted); }
.grid tr.repl td { background: #fffaeb; }
.grid tr.dead td { background: var(--danger-soft); }
.grid tr.dragging { opacity: 0.6; }
.grid tr.drop-before td { box-shadow: inset 0 3px 0 var(--accent); }
.grid .handle { width: 26px; color: #a7b1ab; cursor: grab; font-size: 18px; text-align: center; touch-action: none; user-select: none; padding-top: 10px; }
.grid .num { width: 34px; color: var(--muted); font-size: 12.5px; padding-top: 12px; text-align: right; }
input.cell { width: 100%; border: 1px solid #dfe5e1; border-radius: 7px; padding: 7px 9px; background: #fff; }
input.cell:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
input.cell:disabled { background: #f3f5f3; color: #a1aaa5; }
input.cell.mono { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.lk { display: flex; align-items: center; gap: 6px; }
.tag { flex: none; display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; letter-spacing: 0.03em; }
.tag:empty { display: none; }
.tag.s { background: #e8eef9; color: #2c4f8f; }
.tag.i { background: #f1ede4; color: #6b5a2d; }
.found { font-size: 13px; min-width: 240px; padding-top: 4px; }
.found .ok { color: var(--accent-dk); font-weight: 800; }
.found .muted { color: var(--muted); }
.found .repl-note { color: #7a5a00; font-weight: 700; }
.found .repl-btns { display: flex; gap: 6px; margin: 4px 0 5px; }
.found .repl-btns button { border-radius: 7px; padding: 3px 11px; font-weight: 700; font-size: 12px; background: #fff; color: var(--ink); border: 1px solid var(--line); }
.found .repl-btns [data-confirm] { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 800; }
.found .dead-note { color: var(--danger); font-weight: 700; }
.found u { cursor: pointer; color: var(--accent-dk); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid #dfe5e1; border-radius: 8px; overflow: hidden; font-size: 12.5px; font-weight: 700; margin-top: 2px; }
.seg button { padding: 6px 9px; color: var(--muted); }
.seg button.on-p { background: var(--accent-soft); color: var(--accent-dk); }
.seg button.on-m { background: var(--md-soft); color: var(--md); }
.sw { position: relative; display: inline-block; width: 40px; height: 24px; margin-top: 4px; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw span { position: absolute; inset: 0; background: #cfd6d2; border-radius: 999px; transition: background 0.15s; cursor: pointer; }
.sw span::before { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform 0.15s; }
.sw input:checked + span { background: var(--accent); }
.sw input:checked + span::before { transform: translateX(16px); }
.del { color: #a7b1ab; font-size: 18px; padding: 6px; border-radius: 6px; }
.del:hover { color: var(--danger); background: var(--danger-soft); }
.desk-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
.desk-foot button { font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: underline; padding: 4px; }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: #14201a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 60; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-text">
    <div class="hdr-title" id="hdr-title">Weekly order</div>
    <div class="hdr-sub" id="hdr-sub"></div>
  </div>
  <button class="hdr-btn" id="hdr-btn"></button>
</header>
<main id="main"></main>
<div class="bar" id="bar" hidden><div class="bar-inner" id="bar-inner"></div></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ============================================================
//  SETTINGS
// ============================================================
const ORDER_EMAIL  = 'highlandrootsmkt@gmail.com';
const ACCOUNTS     = { produce: { label: 'Produce', number: '94273' }, meat: { label: 'Meat & Dairy', number: '94274' } };
const MAX_QTY      = 4;      // taps cycle 0 → 1 → … → 4 → 0
const SHOW_FIRST   = 5;      // options shown before "Show all"
const STALE_HOURS  = 30;     // older prices get the amber note
const VAR_SEP      = '::';   // quantity key for one option: "<product key>::<item #>"

const KEY_PRODUCTS = 'ps_products_v1';
const KEY_QTY      = 'ps_qty_v1';
const KEY_PRICES   = 'ps_prices_v1';
const KEY_LAST     = 'ps_last_order_v1';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAcHJry0jBXgye8x5n9SycaFusNrMSMPTo",
  authDomain: "picksheet-8b2a0.firebaseapp.com",
  databaseURL: "https://picksheet-8b2a0-default-rtdb.firebaseio.com",
  projectId: "picksheet-8b2a0",
  storageBucket: "picksheet-8b2a0.firebasestorage.app",
  messagingSenderId: "435644857860",
  appId: "1:435644857860:web:f4c37f1cf2cc30541ebf51"
};

// ============================================================
//  STATE
// ============================================================
let db = null;
let products = [];        // [{ key, name, lookup, account:'produce'|'meat', exclude, hidden, replaced? }]
let productsLoaded = false;
let prices = null;        // { checkedAt, products:{ key: entry }, running? }
let qty = {};             // { productKey: n, 'productKey::itemNo': n }
let view = location.hash === '#setup' ? 'setup' : 'order';   // 'order' | 'setup' | 'sent' (the alert email links to #setup)
let sentOrder = null;
let openFamilies = {};
let showAllFor = {};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n).toFixed(2);
// Price of one piece in the case, from the pack size in the name:
// "12/6 oz" → ÷12, "9 ct" → ÷9. Cases sold by weight ("19 lb", "12/3 lb")
// show $/lb instead, so they get none.
function eachText(desc, casePrice) {
  const d = String(desc || '');
  if (!(casePrice > 0) || /\d\s*(lb|#)\b/i.test(d)) return '';
  const range = d.match(/\b(\d+)\s*\/\s*(\d+)\s*ct\b/i);
  if (range && +range[2] > +range[1]) return money(casePrice / range[2]) + '–' + money(casePrice / range[1]).slice(1) + ' each';
  const m = d.match(/\b(\d+)\s*\/\s*\d/) || d.match(/\b(\d+)\s*ct\b/i);
  const n = m ? +m[1] : 0;
  return n > 1 ? money(casePrice / n) + ' each' : '';
}
// The short price shown for a family: $/lb, else per piece, else the case.
function fromText(o) {
  return o.perLb != null ? money(o.perLb) + '/lb' : eachText(o.description, o.casePrice) || money(o.casePrice);
}
const dollars = n => '$' + Math.round(n).toLocaleString();
const isItemNo = s => /^\d+$/.test(String(s || '').trim());
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const newKey = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function readLocal(key, fallback) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; } catch (e) { return fallback; } }
function writeLocal(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

function whenText(iso) {
  const d = new Date(iso);
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === new Date().toDateString()) return `today ${time}`;
  if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return `yesterday ${time}`;
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + time;
}

// ============================================================
//  FIREBASE
// ============================================================
function initFirebase() {
  if (typeof firebase === 'undefined') return;
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); }
  catch (e) { console.warn('Firebase unavailable, working from this phone only:', e); }
}

function loadProducts() {
  products = readLocal(KEY_PRODUCTS, []);
  productsLoaded = products.length > 0;
  if (!db) return;
  db.ref('products').on('value', async snap => {
    const remote = snap.val();
    if (remote && Array.isArray(remote.items)) {
      products = remote.items.filter(Boolean).map(cleanProduct);
    } else {
      products = await buildFromOldList();    // first time: copy the old three-page list
      if (products.length) saveProducts();
    }
    productsLoaded = true;
    writeLocal(KEY_PRODUCTS, products);
    if (!editing()) render();
  }, err => { console.warn('Product list read failed:', err); toast('Could not load the product list. Showing the last saved copy.'); });
}

/** Don't redraw the setup table under someone's cursor. */
function editing() {
  const a = document.activeElement;
  return view === 'setup' && a && a.classList && a.classList.contains('cell');
}

function cleanProduct(p) {
  const str = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
  const out = {
    key: str(p.key) || newKey(),
    name: str(p.name),
    lookup: str(p.lookup).trim(),
    account: p.account === 'meat' ? 'meat' : 'produce',
    exclude: str(p.exclude),
    hidden: !!p.hidden
  };
  if (p.replaced && p.replaced.from) out.replaced = { from: str(p.replaced.from), at: str(p.replaced.at) };
  if (p.keepOld) out.keepOld = str(p.keepOld);
  return out;
}

/** The old list had three pages. Seasonal and Produce become Produce rows, Meat becomes M&D, in that order. */
async function buildFromOldList() {
  let old = null;
  try { old = (await db.ref('order-config').get()).val(); } catch (e) {}
  const items = (old && old.items) || {};
  const out = [];
  [['seasonal', 'produce'], ['produce', 'produce'], ['meat', 'meat']].forEach(([sec, account]) => {
    (items[sec] || []).filter(i => i && i.name).forEach(i => {
      const weekly = typeof i.weekly === 'boolean' ? i.weekly : sec === 'seasonal';
      const lookup = weekly || !i.id ? (i.lookup || 'OG ' + i.name.trim()) : String(i.id);
      out.push(cleanProduct({ name: i.name.trim(), lookup, account, exclude: weekly ? i.exclude : '' }));
    });
  });
  return out;
}

let saveTimer = null;
function saveProducts(soon) {
  writeLocal(KEY_PRODUCTS, products);
  clearTimeout(saveTimer);
  setSaved('Saving…');
  const go = () => {
    if (!db) { setSaved('Saved on this device only'); return; }
    db.ref('products').set({ items: products, updatedAt: new Date().toISOString() })
      .then(() => setSaved('✓ Saved'))
      .catch(() => setSaved('⚠ Not saved'));
  };
  if (soon) saveTimer = setTimeout(go, 600); else go();
}
function setSaved(text) { const el = $('saved'); if (el) el.textContent = text; }

function loadPrices() {
  prices = readLocal(KEY_PRICES, null);
  if (!db) return;
  db.ref('prices').on('value', snap => {
    const remote = snap.val();
    if (!remote) return;
    const strip = x => JSON.stringify({ ...(x || {}), running: null, failed: null });
    const progressOnly = prices && strip(prices) === strip(remote);
    if (remote.running || (remote.failed && Date.parse(remote.failed.at) > checkRequestedAt)) checkRequestedAt = 0;   // the check has started (or already failed)
    prices = remote;
    if (progressOnly) { updateCheckBar(); return; }   // just the "34 of 118" count changed
    writeLocal(KEY_PRICES, prices);
    if (!editing()) render();
  }, err => console.warn('Price read failed:', err));
}

function loadQty() { qty = readLocal(KEY_QTY, {}); }

// ============================================================
//  WHAT FOUR SEASONS SAID ABOUT A PRODUCT
// ============================================================
/** This week's price entry for a product, only if it was checked with the product's current lookup. */
function entryFor(p) {
  if (!prices) return null;
  const e = prices.products && prices.products[p.key];
  // A row is stale if its item # / search words changed, or it was moved to the other account since the check.
  if (e) return norm(e.lookup) === norm(p.lookup) && (!e.account || e.account === (p.account === 'meat' ? 'meat' : 'produce')) ? e : null;
  // Prices saved before the redesign are listed by name
  if (prices.sections) {
    for (const list of Object.values(prices.sections)) {
      const old = (list || []).find(x => x && x.name === p.name);
      if (old && norm(old.weekly ? old.lookup : old.id) === norm(p.lookup)) return old;
    }
  }
  return null;
}

/**
 * How a product shows this week:
 *   item     fixed item #, orderable (price shows once checked)
 *   dead     item # not on Four Seasons (obsolete) and no replacement
 *   options  search words with this week's options
 *   none     search words that matched nothing this week
 *   waiting  search words not checked yet
 */
function stateOf(p) {
  const e = entryFor(p);
  if (isItemNo(p.lookup)) {
    if (e && (e.status === 'not-found' || e.status === 'obsolete')) return { kind: 'dead', entry: e };
    return { kind: 'item', entry: e };
  }
  if (!e) return { kind: 'waiting' };
  // Apply "Leave out words" right away, without waiting for the next price check.
  const words = String(p.exclude || '').split(/[,;]/).map(w => w.trim().toLowerCase()).filter(Boolean);
  const options = (Array.isArray(e.options) ? e.options : []).filter(o => !words.some(w => String(o.description).toLowerCase().includes(w)));
  if (options.length) return { kind: 'options', entry: { ...e, options } };
  return { kind: 'none', entry: e };
}

function shortName(description, lookup) {
  const words = String(lookup || '').trim().split(/\s+/).filter(Boolean);
  let d = String(description);
  for (const w of words) {
    const re = new RegExp('^' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s+', 'i');
    if (!re.test(d)) break;
    d = d.replace(re, '');
  }
  return d || description;
}

function familyTotal(key) {
  const prefix = key + VAR_SEP;
  return Object.entries(qty).reduce((t, [k, v]) => k.startsWith(prefix) ? t + (v || 0) : t, 0);
}

/** Every line being ordered, in store order. */
function orderLines() {
  const lines = [];
  products.forEach(p => {
    if (p.hidden) return;
    const st = stateOf(p);
    if (st.kind === 'item') {
      const q = qty[p.key] || 0;
      if (q > 0) lines.push({ account: p.account, id: p.lookup.trim(), q, name: (st.entry && st.entry.description) || p.name, casePrice: (st.entry && st.entry.casePrice) || null });
    } else if (st.kind === 'options') {
      st.entry.options.forEach(o => {
        const q = qty[p.key + VAR_SEP + o.code] || 0;
        if (q > 0) lines.push({ account: p.account, id: String(o.code), q, name: o.description, casePrice: o.casePrice || null });
      });
    }
  });
  return lines;
}

function summary(lines, account) {
  const mine = lines.filter(l => l.account === account);
  const priced = mine.filter(l => l.casePrice);
  return {
    lines: mine,
    count: mine.length,
    cases: mine.reduce((t, l) => t + l.q, 0),
    est: priced.length ? priced.reduce((t, l) => t + l.casePrice * l.q, 0) : null
  };
}

function renderHeader() {
  const sub = $('hdr-sub');
  const btn = $('hdr-btn');
  if (view === 'setup') {
    $('hdr-title').textContent = 'Product setup';
    sub.textContent = 'Changes save by themselves and reach every phone';
    btn.textContent = 'Done';
    btn.onclick = () => go('order');
  } else if (view === 'sent') {
    $('hdr-title').textContent = 'Order sent';

      const old = (Date.now() - new Date(prices.checkedAt)) / 36e5 > STALE_HOURS;
      sub.innerHTML = `<span class="${old ? 'old' : 'ok'}">${old ? '⚠' : '✓'} Prices from ${esc(whenText(prices.checkedAt))}</span> · ${shown} items`;

let orderUnsub = null;
function go(next) {
  view = next;
  if (next !== 'sent' && orderUnsub) { orderUnsub(); orderUnsub = null; }
  window.scrollTo(0, 0);
  render();
}

function render() {

  else renderOrder();
}

function renderOrder() {
  const main = $('main');
  main.className = '';
  const keep = main.dataset.view === 'order' ? window.scrollY : null;
  main.dataset.view = 'order';
  main.innerHTML = '';

  const last = readLocal(KEY_LAST, null);
  if (last && Date.now() - new Date(last.at) < 36 * 36e5) {
    const n = document.createElement('div');
    n.className = 'note info';
    n.innerHTML = `<span>Last order sent ${esc(whenText(last.at))}</span><button>See how it went</button>`;
    n.querySelector('button').onclick = () => openSent(last.id);
    main.appendChild(n);
  }
  if (prices && prices.checkedAt && (Date.now() - new Date(prices.checkedAt)) / 36e5 > STALE_HOURS) {
    const n = document.createElement('div');
    n.className = 'note warn';
    n.textContent = `⚠ Prices are from ${whenText(prices.checkedAt)}. The latest morning check didn't run, so some items may have changed.`;
    main.appendChild(n);
  }

  const visible = products.filter(p => !p.hidden);
  if (!visible.length) {
    main.insertAdjacentHTML('beforeend', `<div class="empty">${productsLoaded ? 'No products yet. Tap Setup to add them.' : 'Loading products…'}</div>`);
  } else {
    const list = document.createElement('div');
    list.className = 'list';
    visible.forEach(p => {
      const st = stateOf(p);
      if (st.kind === 'options') addFamily(list, p, st.entry);
      else addPlain(list, p, st);
    });
    main.appendChild(list);
  }
  if (keep != null) window.scrollTo(0, keep);
  renderBar();
}

function nameEl(p, text) {
  const t = document.createElement('div');
  t.className = 't';
  t.textContent = text;
  if (p.account === 'meat') t.insertAdjacentHTML('beforeend', '<span class="chip md">M&amp;D</span>');
  return t;
}

function addPlain(list, p, st) {
  const row = document.createElement('div');
  row.className = 'row';
  const nm = document.createElement('div');
  nm.className = 'nm';
  const e = st.entry;
  nm.appendChild(nameEl(p, p.name || (e && e.description) || '#' + p.lookup));
  const s = document.createElement('div');
  s.className = 's';
  let usable = true;
  if (st.kind === 'item') {
    const unit = e ? (e.perLb != null ? money(e.perLb) + '/lb' : eachText(e.description, e.casePrice)) : '';
    const cs = e && e.casePrice ? money(e.casePrice) : '';
    s.innerHTML = unit ? `<b class="u">${esc(unit)}</b>${cs ? ' · ' + cs + ' case' : ''}` : cs ? `<b class="u">${cs}</b> case` : '';
    if (e && e.onAd) s.insertAdjacentHTML('beforeend', '<span class="chip ad">ON AD</span>');
  } else {
    usable = false;
    s.className = st.kind === 'dead' ? 's bad' : 's na';
    s.textContent = st.kind === 'dead' ? 'Obsolete, no replacement yet' : st.kind === 'none' ? 'Not available this week' : 'Options not checked yet';
  }
  if (s.textContent) nm.appendChild(s);
  if (!usable) row.classList.add('dim');
  row.append(nm, makeQty(p.key, p.name, usable));
  list.appendChild(row);
}

function addFamily(list, p, e) {
  const open = !!openFamilies[p.key];
  const opts = e.options;
  const best = opts[0];
  const row = document.createElement('div');
  row.className = 'row fam' + (open ? ' open' : '');
  row.setAttribute('role', 'button');
  row.setAttribute('aria-expanded', String(open));
  const nm = document.createElement('div');
  nm.className = 'nm';
  nm.appendChild(nameEl(p, p.name));
  const s = document.createElement('div');
  s.className = 's go';
  s.textContent = `${plural(opts.length, 'option')} · from ${fromText(best)}`;
  nm.appendChild(s);
  const chev = document.createElement('span');
  chev.className = 'chev';
  chev.textContent = open ? '▲' : '▼';
  const box = document.createElement('div');
  box.className = 'qbox';
  const total = familyTotal(p.key);
  box.innerHTML = `<div class="q sum${total ? ' on' : ''}" id="sum_${p.key}">${total || '—'}</div>`;
  row.append(nm, chev, box);
  row.onclick = () => { openFamilies[p.key] = !open; renderOrder(); };
  list.appendChild(row);
  if (!open) return;

  const all = !!showAllFor[p.key];
  opts.forEach((o, i) => {
    const qk = p.key + VAR_SEP + o.code;
    if (!all && i >= SHOW_FIRST && !(qty[qk] > 0)) return;
    const vr = document.createElement('div');
    vr.className = 'row var';
    const vn = document.createElement('div');
    vn.className = 'nm';
    const label = shortName(o.description, e.lookup);
    vn.innerHTML = `<div class="t">${esc(label)}${i === 0 ? '<span class="chip cheap">CHEAPEST</span>' : ''}${o.onAd ? '<span class="chip ad">ON AD</span>' : ''}</div>`;
    const pr = document.createElement('div');
    pr.className = 'pr';
    const each = eachText(o.description, o.casePrice);
    const unit = o.perLb != null ? money(o.perLb) + '/lb' : each;
    pr.innerHTML = unit ? `${unit}<small>${money(o.casePrice)} case</small>` : money(o.casePrice);
    vr.append(vn, pr, makeQty(qk, label, true));
    list.appendChild(vr);
  });
  if (opts.length > SHOW_FIRST) {
    const more = document.createElement('div');
    more.className = 'row more';
    more.textContent = all ? 'Show fewer ▴' : `Show all ${opts.length} ${p.name.toLowerCase()} ▾`;
    more.onclick = () => { showAllFor[p.key] = !all; renderOrder(); };
    list.appendChild(more);
  }
}

/** Quantity circle: tap adds one (4 wraps to 0), hold about a second to clear. */
function makeQty(qk, label, usable) {
  const box = document.createElement('div');
  box.className = 'qbox';
  const q = usable ? (qty[qk] || 0) : 0;
  box.innerHTML = `<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21"/></svg><div class="q${q ? ' on' : ''}${usable ? '' : ' off'}" role="button" tabindex="${usable ? 0 : -1}" aria-label="${esc(label)}: ${q} cases. Tap to add, hold to clear.">${q || '—'}</div>`;
  if (!usable) return box;
  const badge = box.querySelector('.q');
  const ring = box.querySelector('.ring');
  let timer = null, held = false, startY = 0;

  const set = (n, bump) => {
    if (n) qty[qk] = n; else delete qty[qk];
    saveQty();
    badge.textContent = n || '—';
    badge.className = 'q' + (n ? ' on' : '');
    if (bump && n) { void badge.offsetWidth; badge.classList.add('bump'); }
    if (qk.includes(VAR_SEP)) {
      const fam = qk.split(VAR_SEP)[0];
      const sum = $('sum_' + fam);
      const t = familyTotal(fam);
      if (sum) { sum.textContent = t || '—'; sum.className = 'q sum' + (t ? ' on' : ''); }
    }
    renderBar();
  };
  const tap = () => { const n = qty[qk] || 0; set(n >= MAX_QTY ? 0 : n + 1, true); };
  const start = y => {
    held = false; startY = y;
    ring.classList.add('go');
    timer = setTimeout(() => { held = true; ring.classList.remove('go'); set(0); if (navigator.vibrate) navigator.vibrate(60); }, 900);
  };
  const cancel = () => { clearTimeout(timer); ring.classList.remove('go'); };
  const end = () => { cancel(); if (!held) tap(); held = true; };

  badge.addEventListener('click', e => e.stopPropagation());
  badge.addEventListener('mousedown', e => { if (e.button === 0) start(e.clientY); });
  badge.addEventListener('mouseup', end);
  badge.addEventListener('mouseleave', () => { cancel(); held = true; });
  badge.addEventListener('touchstart', e => start(e.touches[0].clientY), { passive: true });
  badge.addEventListener('touchmove', e => { if (Math.abs(e.touches[0].clientY - startY) > 10) { cancel(); held = true; } }, { passive: true });
  badge.addEventListener('touchend', e => { e.preventDefault(); end(); }, { passive: false });
  badge.addEventListener('touchcancel', () => { cancel(); held = true; });
  badge.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
  return box;
}

function renderBar() {
  const bar = $('bar');
  if (view !== 'order') { bar.hidden = true; return; }
  bar.hidden = false;
  const lines = orderLines();
  const cases = lines.reduce((t, l) => t + l.q, 0);
  const priced = lines.filter(l => l.casePrice);
  const est = priced.length ? priced.reduce((t, l) => t + l.casePrice * l.q, 0) : null;
  $('bar-inner').innerHTML = `<div class="tot">${lines.length ? `${plural(lines.length, 'item')} · ${plural(cases, 'case')}` : 'Nothing picked yet'}<b>${est != null ? 'Est. ' + dollars(est) : '&nbsp;'}</b></div><button class="btn" id="review-btn"${lines.length ? '' : ' disabled'}>Review &amp; send</button>`;
  $('review-btn').onclick = showReview;
}

function showReview() {
  const lines = orderLines();
  const P = summary(lines, 'produce');
  const M = summary(lines, 'meat');
  const row = (acct, s) => `<div class="sum-row"><div class="nm"><b>${ACCOUNTS[acct].label}</b><div class="s">Customer ${ACCOUNTS[acct].number} · ${s.count ? plural(s.count, 'item') + ', ' + plural(s.cases, 'case') : 'nothing this week'}</div></div><div class="pr">${s.est != null ? dollars(s.est) : '—'}</div></div>`;
  const sheet = openSheet(`
    <h2>Review order</h2>
    <div class="lead">${esc(new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }))}</div>
    <div class="list">${row('produce', P)}${row('meat', M)}</div>
    <div class="acts">
      <button class="btn block" id="send-btn">Send order</button>
      <button class="btn ghost block" id="cancel-btn">Keep picking</button>
    </div>
    <div class="fine">Emails the order to ${esc(ORDER_EMAIL)} and loads both Four Seasons carts. Nothing is submitted.</div>`);
  sheet.querySelector('#cancel-btn').onclick = closeSheet;
  sheet.querySelector('#send-btn').onclick = e => sendOrder(e.currentTarget, lines);
}

function stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

async function sendOrder(btn, lines) {
  btn.disabled = true;
  btn.textContent = 'Sending…';
  const id = stamp() + '-' + Date.now().toString(36);
  const strip = arr => arr.map(({ account, ...l }) => l);
  const order = {
    createdAt: new Date().toISOString(),
    site: location.origin,
    produce: strip(summary(lines, 'produce').lines),
    meat: strip(summary(lines, 'meat').lines)
  };
  try {
    if (!db) throw new Error('offline');
    await db.ref('orders/' + id).set(order);
    const res = await fetch('/.netlify/functions/send-order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    if (res.status === 404) throw new Error('not-set-up');
    if (!res.ok) throw new Error('failed');
    const out = await res.json().catch(() => ({}));
    if (out.email !== 'sent' && out.robot !== 'started') throw new Error(out.emailError || 'failed');
    db.ref(`orders/${id}/email`).set(out.email === 'sent' ? { state: 'sent' } : { state: 'failed', error: out.emailError || '' }).catch(() => {});
    if (out.robot !== 'started') db.ref(`orders/${id}/start`).set({ state: 'failed', error: out.robotError || '' }).catch(() => {});
    writeLocal(KEY_LAST, { id, at: order.createdAt });
    qty = {}; saveQty(); openFamilies = {}; showAllFor = {};
    closeSheet();
    openSent(id);
  } catch (e) {
    closeSheet();
    showManualSend(lines, e.message);
  }
}

/** Sending isn't available (not switched on yet, or no signal): share the files by hand instead. */
function showManualSend(lines, why) {
  const notSetUp = why === 'not-set-up';
  const msg = notSetUp
    ? 'Automatic sending isn\'t switched on yet, so share the order by hand this time. Your quantities stay until you clear them.'
    : 'The order couldn\'t be sent. Check the signal and try again, or share it by hand. Your quantities are kept.';
  const canShare = navigator.canShare && navigator.canShare({ files: [new File([''], 'a.csv', { type: 'text/csv' })] });
  const sheet = openSheet(`
    <h2>${notSetUp ? 'Send by hand' : 'Not sent'}</h2>
    <div class="lead">${esc(msg)}</div>
    <div class="acts">
      ${notSetUp ? '' : '<button class="btn block" id="retry-btn">Try again</button>'}
      <button class="btn ${notSetUp ? '' : 'line '}block" id="share-btn">${canShare ? 'Share CSV files' : 'Open email'}</button>
      <button class="btn ghost block" id="cancel-btn">Cancel</button>
    </div>`);
  sheet.querySelector('#cancel-btn').onclick = closeSheet;
  const retry = sheet.querySelector('#retry-btn');
  if (retry) retry.onclick = () => { closeSheet(); showReview(); };
  sheet.querySelector('#share-btn').onclick = async () => {
    closeSheet();
    const produce = csvFor(lines.filter(l => l.account === 'produce'));
    const meat = csvFor(lines.filter(l => l.account === 'meat'));
    let shared = false;
    if (canShare) {
      try {
        await navigator.share({ title: `Four Seasons order ${stamp()}`, files: [
          new File([produce], `order-produce-${stamp()}.csv`, { type: 'text/csv' }),
          new File([meat], `order-meat-${stamp()}.csv`, { type: 'text/csv' })] });
        shared = true;
      } catch (err) { if (err.name === 'AbortError') return; }
    }
    if (!shared) {
      const body = `Four Seasons order ${stamp()}\n\n=== PRODUCE (${ACCOUNTS.produce.number}) ===\n${produce}\n\n=== MEAT & DAIRY (${ACCOUNTS.meat.number}) ===\n${meat}`;
      location.href = `mailto:${ORDER_EMAIL}?subject=${encodeURIComponent('Four Seasons order ' + stamp())}&body=${encodeURIComponent(body)}`;
    }
    setTimeout(askClear, 600);
  };
}

function csvFor(lines) {
  return ['ItemID,Quantity,ItemName'].concat(lines.map(l => `${l.id},${l.q},${String(l.name).replace(/,/g, ' ')}`)).join('\n');
}

function askClear() {
  const sheet = openSheet(`
    <h2>Clear quantities?</h2>
    <div class="lead">Do this once the order has gone out, so next week starts empty.</div>
    <div class="acts"><button class="btn block" id="yes-btn">Clear quantities</button><button class="btn ghost block" id="no-btn">Keep them</button></div>`);
  sheet.querySelector('#no-btn').onclick = closeSheet;
  sheet.querySelector('#yes-btn').onclick = () => { qty = {}; saveQty(); closeSheet(); renderOrder(); toast('Quantities cleared'); };
}

function openSent(id) {
  sentOrder = null;
  go('sent');
  if (!db) return;
  const ref = db.ref('orders/' + id);
  const cb = ref.on('value', snap => { sentOrder = snap.val(); if (view === 'sent') render(); });
  orderUnsub = () => ref.off('value', cb);
}

function renderSent() {
  const main = $('main');
  main.className = '';
  main.dataset.view = 'sent';
  renderBar();
  const o = sentOrder;
  if (!o) { main.innerHTML = '<div class="empty">Loading…</div>'; return; }
  const icon = st => `<div class="ic ${{ done: 'ok', failed: 'bad', running: 'run' }[st] || ''}">${{ done: '✓', failed: '!', running: '⟳' }[st] || '·'}</div>`;
  const robot = o.robot || {};
  const steps = [];

  const em = o.email || {};
  const emState = em.state === 'sent' ? 'done' : em.state === 'failed' ? 'failed' : 'running';
  steps.push(`<div class="step-row">${icon(emState)}<div class="nm"><b>${{ done: 'Email sent', failed: 'Email not sent', running: 'Sending email…' }[emState]}</b><div class="s${emState === 'failed' ? ' bad' : ''}">${emState === 'failed' ? esc(em.error || 'Something went wrong.') : 'to ' + esc(ORDER_EMAIL)}</div></div></div>`);

  ['produce', 'meat'].forEach(acct => {
    const lines = o[acct] || [];
    const r = robot[acct] || {};
    const label = ACCOUNTS[acct].label;
    if (!lines.length) {
      steps.push(`<div class="step-row">${icon('done')}<div class="nm"><b>${label}</b><div class="s">Nothing ordered this week. Cart left alone.</div></div></div>`);
      return;
    }
    const notStarted = o.start && o.start.state === 'failed';
    const state = r.state || (robot.state === 'failed' || notStarted ? 'failed' : 'waiting');
    let title, detail;
    if (state === 'done') {
      title = `${label} cart loaded`;
      const bits = [`${plural(r.added != null ? r.added : lines.length, 'item')} added`];
      if (r.alreadyCount) bits.push(`${plural(r.alreadyCount, 'item')} already there`);
      if (r.cartTotal) bits.push(`cart total ${r.cartTotal}`);
      detail = esc(bits.join(' · '));
    } else if (state === 'running') {
      title = `Loading ${label} cart…`;
      detail = 'Usually takes a couple of minutes';
    } else if (state === 'failed') {
      title = `${label} cart not loaded`;
      detail = esc(r.error || robot.error || (notStarted ? 'The cart robot couldn\'t start.' : 'Something went wrong.')) + ' Import the CSV from the order email by hand.';
    } else {
      title = `${label} cart`;
      detail = robot.state === 'running' ? 'Waiting its turn' : 'Waiting for the cart robot to start';
    }
    steps.push(`<div class="step-row">${icon(state)}<div class="nm"><b>${title}</b><div class="s${state === 'failed' ? ' bad' : ''}">${detail}</div></div></div>`);
    if (Array.isArray(r.obsolete) && r.obsolete.length) {
      steps.push(`<div class="step-row">${icon('failed')}<div class="nm"><b style="color:var(--danger)">${plural(r.obsolete.length, 'obsolete item')} in ${label}</b><div class="s"><ul>${r.obsolete.map(x => `<li>${esc(x)}</li>`).join('')}</ul>Not added. Pick a replacement on Four Seasons.</div></div></div>`);
    }
    if (Array.isArray(r.overlaps) && r.overlaps.length) {
      steps.push(`<div class="step-row"><div class="ic">i</div><div class="nm"><b>Already in the ${label} cart before this order</b><div class="s"><ul>${r.overlaps.map(x => `<li>${esc(x)}</li>`).join('')}</ul>Both were kept.</div></div></div>`);
    }
  });

  main.innerHTML = `<div class="list">${steps.join('')}</div>
    <div class="fine">${robot.state === 'done' ? 'Both carts are waiting for review on Four Seasons. Nothing was submitted.' : 'You can close the app. The carts keep loading, and a second email reports the result.'}</div>`;
}

// ============================================================
//  SETUP — the master product table
// ============================================================
function renderSetup() {
  const main = $('main');
  const keep = main.dataset.view === 'setup' ? window.scrollY : null;
  const keepX = main.querySelector('.scroll') ? main.querySelector('.scroll').scrollLeft : 0;
  main.className = 'wide';
  main.dataset.view = 'setup';
  main.innerHTML = '';
  renderBar();

  const top = document.createElement('div');
  top.className = 'desk-top';
  top.innerHTML = `<div class="count">Products · ${products.length} items</div>
    <span class="saved" id="saved"></span>
    <span class="chk" id="chk"></span>
    <button id="check-btn"></button>
    <button class="add" id="add-btn">+ Add product</button>`;
  main.appendChild(top);

  const rep = products.filter(p => p.replaced).length;
  const dead = products.filter(p => !p.replaced && stateOf(p).kind === 'dead').length;
  if (rep || dead) {
    const n = document.createElement('div');
    n.className = 'desk-note';
    n.innerHTML = [rep ? `<b>${plural(rep, 'item')} replaced automatically</b>` : '', dead ? `<b>${plural(dead, 'item')} not on Four Seasons</b>` : ''].filter(Boolean).join(', ') + `. ${rep + dead === 1 ? 'It\'s' : 'They\'re'} highlighted below.`;
    main.appendChild(n);
  }
  main.insertAdjacentHTML('beforeend', `<div class="desk-help">One row per product, in the order your team walks the store. Drag <b>⠿</b> to move a row. In <b>Look up by</b>, type search words (like <i>OG Apples</i>) to see every option each week, or an item # (digits only) for one fixed product.</div>`);

  const wrap = document.createElement('div');
  wrap.className = 'scroll';
  const table = document.createElement('table');
  table.className = 'grid';
  table.innerHTML = `<thead><tr><th></th><th>#</th><th>Name on picksheet</th><th>Look up by</th><th>Found on Four Seasons</th><th>Account</th><th>Leave out words</th><th>On phone</th><th></th></tr></thead>`;
  const tbody = document.createElement('tbody');
  products.forEach((p, i) => tbody.appendChild(setupRow(p, i)));
  table.appendChild(tbody);
  wrap.appendChild(table);
  main.appendChild(wrap);
  wrap.scrollLeft = keepX;

  const foot = document.createElement('div');
  foot.className = 'desk-foot';
  foot.innerHTML = `<button id="backup-btn">Download a backup</button><button id="restore-btn">Restore from a backup</button>`;
  main.appendChild(foot);

  $('add-btn').onclick = () => {
    products.push(cleanProduct({ name: '', lookup: '', account: 'produce' }));
    saveProducts(true);
    renderSetup();
    const first = document.querySelector('.grid tbody tr:last-child input.cell');
    if (first) { first.scrollIntoView({ block: 'center' }); first.focus(); }
  };
  $('check-btn').onclick = checkNow;
  updateCheckBar();
  $('backup-btn').onclick = downloadBackup;
  $('restore-btn').onclick = restoreBackup;
  if (keep != null) window.scrollTo(0, keep);
}

function setupRow(p, i) {
  const tr = document.createElement('tr');
  tr.dataset.key = p.key;
  const st = stateOf(p);
  if (p.hidden) tr.classList.add('hiddenrow');
  if (p.replaced) tr.classList.add('repl');
  else if (st.kind === 'dead') tr.classList.add('dead');
  const item = isItemNo(p.lookup);
  const portalName = item && st.entry && st.entry.description;

  tr.innerHTML = `
    <td class="handle" title="Drag to move">⠿</td>
    <td class="num">${i + 1}</td>
    <td style="min-width:180px"><input class="cell" data-f="name" value="${esc(p.name)}" placeholder="${esc(portalName || 'Name your team sees')}"></td>
    <td style="min-width:190px"><div class="lk"><input class="cell${item ? ' mono' : ''}" data-f="lookup" value="${esc(p.lookup)}" placeholder="OG Apples or 43878"><span class="tag ${item ? 'i' : 's'}">${p.lookup ? (item ? 'ITEM #' : 'SEARCH') : ''}</span></div></td>
    <td class="found">${foundText(p, st)}</td>
    <td><div class="seg"><button data-a="produce" class="${p.account === 'produce' ? 'on-p' : ''}">Produce</button><button data-a="meat" class="${p.account === 'meat' ? 'on-m' : ''}">M&amp;D</button></div></td>
    <td style="min-width:140px"><input class="cell" data-f="exclude" value="${esc(item ? '' : p.exclude)}" placeholder="${item ? 'Search rows only' : 'e.g. Juice, pk'}"${item ? ' disabled' : ''}></td>
    <td><label class="sw" title="Show on the phone"><input type="checkbox"${p.hidden ? '' : ' checked'}><span></span></label></td>
    <td><button class="del" title="Delete" aria-label="Delete">✕</button></td>`;

  // The shared list is reloaded from Firebase after every save, which swaps in
  // fresh row objects. Always edit the current copy, found by its key, or
  // later keystrokes land on a stale copy and are lost.
  const cur = () => products.find(x => x.key === p.key) || p;
  tr.querySelectorAll('input.cell').forEach(inp => {
    const f = inp.dataset.f;
    inp.addEventListener('input', () => {
      cur()[f] = inp.value;
      if (f === 'lookup') {
        const now = isItemNo(inp.value);
        const tag = tr.querySelector('.tag');
        tag.className = 'tag ' + (now ? 'i' : 's');
        tag.textContent = inp.value.trim() ? (now ? 'ITEM #' : 'SEARCH') : '';
        inp.classList.toggle('mono', now);
        const ex = tr.querySelector('input[data-f="exclude"]');
        ex.disabled = now;
        ex.placeholder = now ? 'Search rows only' : 'e.g. Juice, pk';
      }
      saveProducts(true);
    });
    inp.addEventListener('change', () => {
      if (f !== 'lookup') return;
      const q = cur();
      q.lookup = inp.value.trim();
      if (q.replaced) delete q.replaced;   // typing a new lookup replaces the automatic swap
      delete q.keepOld;
      saveProducts();
      setTimeout(() => { if (!editing()) renderSetup(); }, 0);
    });
    inp.addEventListener('blur', () => setTimeout(() => { if (!editing() && f === 'lookup') renderSetup(); }, 0));
  });
  tr.querySelectorAll('.seg button').forEach(b => b.onclick = () => { cur().account = b.dataset.a; saveProducts(); renderSetup(); });
  tr.querySelector('.sw input').onchange = e => { const q = cur(); q.hidden = !e.target.checked; saveProducts(); tr.classList.toggle('hiddenrow', q.hidden); };
  tr.querySelector('.del').onclick = () => confirmDelete(cur());
  const undo = tr.querySelector('[data-undo]');
  if (undo) undo.onclick = () => undoReplace(cur());
  const ok = tr.querySelector('[data-confirm]');
  if (ok) ok.onclick = () => { delete cur().replaced; saveProducts(); renderSetup(); };
  dragRow(tr);
  return tr;
}

function foundText(p, st) {
  const e = st.entry;
  const repl = p.replaced ? `<div class="repl-note">Replaced ${esc(p.replaced.at ? whenText(p.replaced.at) : '')}: #${esc(p.replaced.from)} was obsolete.</div><div class="repl-btns"><button data-confirm>Confirm</button><button data-undo>Undo</button></div>` : '';
  if (!p.lookup) return '<span class="muted">Type search words or an item #</span>';
  switch (st.kind) {
    case 'item':
      if (!e) return repl + '<span class="muted">⟳ Waiting for a check. The Four Seasons name fills in by itself.</span>';
      return repl + `<span class="ok">✓</span> ${esc(e.description || '')}${e.casePrice ? ' · ' + money(e.casePrice) : ''}`;
    case 'dead':
      return repl + `<div class="dead-note">Not on Four Seasons. It may be obsolete or mistyped.</div><span class="muted">Type a new item # or search words.</span>`;
    case 'options': {
      const best = e.options[0];
      return repl + `<span class="ok">✓</span> ${plural(e.options.length, 'option')} · from ${fromText(best)}`;
    }
    case 'none':
      return repl + '<span class="muted">No matches this week</span>';
    default:
      return repl + '<span class="muted">⟳ Waiting for a check</span>';
  }
}

function undoReplace(p) {
  p.keepOld = p.replaced.from;           // the morning check won't swap this one again
  p.lookup = p.replaced.from;
  delete p.replaced;
  saveProducts();
  renderSetup();
  toast('Put the old item # back');
}

function confirmDelete(p) {
  const sheet = openSheet(`
    <h2>Delete ${esc(p.name || 'this product')}?</h2>
    <div class="lead">It disappears from every phone. To keep it but stop showing it, switch off "On phone" instead.</div>
    <div class="acts"><button class="btn block" id="yes-btn" style="background:var(--danger)">Delete</button><button class="btn ghost block" id="no-btn">Cancel</button></div>`);
  sheet.querySelector('#no-btn').onclick = closeSheet;
  sheet.querySelector('#yes-btn').onclick = () => {
    products = products.filter(x => x.key !== p.key);
    Object.keys(qty).forEach(k => { if (k === p.key || k.startsWith(p.key + VAR_SEP)) delete qty[k]; });
    saveQty(); saveProducts(); closeSheet(); renderSetup();
  };
}

/** Drag a row by its ⠿ handle (mouse or finger). */
function dragRow(tr) {
  const handle = tr.querySelector('.handle');
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    tr.classList.add('dragging');
    let target = tr;
    const rows = () => [...tr.parentElement.children];
    const move = ev => {
      rows().forEach(r => r.classList.remove('drop-before'));
      const over = rows().find(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; }) || null;
      target = (over === tr || (over && over.previousElementSibling === tr) || (!over && tr === rows().at(-1))) ? tr : over;
      if (target && target !== tr) target.classList.add('drop-before');
      if (ev.clientY < 110) window.scrollBy(0, -14);
      if (ev.clientY > window.innerHeight - 50) window.scrollBy(0, 14);
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      rows().forEach(r => r.classList.remove('drop-before'));
      tr.classList.remove('dragging');
      if (target === tr) return;
      const [moved] = products.splice(products.findIndex(x => x.key === tr.dataset.key), 1);
      const to = target ? products.findIndex(x => x.key === target.dataset.key) : products.length;
      products.splice(to, 0, moved);
      saveProducts();
      renderSetup();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
}

/** Ask the cloud to check rows that changed since the last check (or every row if none did). */
// ── Check Four Seasons now: what the bar in Setup says ──
const SECS_PER_ROW = 2.6, STARTUP_SECS = 75;
let checkRequestedAt = 0;
const changedKeys = () => products.filter(p => p.lookup && !entryFor(p)).map(p => p.key);
const aboutMin = secs => `about ${Math.max(1, Math.round(secs / 60))} min`;

function checkState() {
  const now = Date.now();
  const r = prices && prices.running;
  if (r && r.startedAt) {
    const last = new Date(r.at || r.startedAt).getTime();
    if (now - last > 10 * 60e3 || now - new Date(r.startedAt) > 30 * 60e3) return { busy: false, text: '⚠ The last check didn\'t finish. Try again.', warn: true };
    if (!r.total) return { busy: true, text: '⟳ Signing in to Four Seasons…' };
    const left = Math.max(1, Math.ceil((r.total - (r.done || 0)) * SECS_PER_ROW / 60));
    return { busy: true, text: `⟳ Checking Four Seasons… ${r.done || 0} of ${r.total} · about ${left} min left` };
  }
  if (checkRequestedAt && now - checkRequestedAt < 5 * 60e3) return { busy: true, text: '⟳ Starting the check…' };
  if (checkRequestedAt) return { busy: false, text: '⚠ The check didn\'t start. Try again.', warn: true };
  const f = prices && prices.failed;
  if (f && f.at && (!prices.checkedAt || Date.parse(f.at) > Date.parse(prices.checkedAt))) {
    return { busy: false, fail: true, text: f.noResponse ? '⚠ Refresh failed: Four Seasons didn\'t respond. Try again soon.' : '⚠ Refresh failed. Try again soon.' };
  }
  return { busy: false, text: prices && prices.checkedAt ? 'Last checked ' + whenText(prices.checkedAt) : 'Not checked yet' };
}

function updateCheckBar() {
  const chk = $('chk'), btn = $('check-btn');
  if (!chk || !btn) return;
  const st = checkState();
  chk.textContent = st.text;
  chk.classList.toggle('warn', !!st.warn);
  chk.classList.toggle('fail', !!st.fail);
  const n = changedKeys().length;
  btn.disabled = st.busy;
  btn.textContent = st.busy ? 'Checking…'
    : n ? `Check ${plural(n, 'changed row')} (${aboutMin(STARTUP_SECS + n * SECS_PER_ROW)})`
    : `Refresh all prices (${aboutMin(STARTUP_SECS + products.filter(p => p.lookup).length * SECS_PER_ROW)})`;
}
setInterval(() => { if (view === 'setup') updateCheckBar(); }, 15000);

async function checkNow() {
  const btn = $('check-btn');
  btn.disabled = true;
  btn.textContent = 'Starting…';
  const keys = changedKeys();
  try {
    const res = await fetch('/.netlify/functions/check-now', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keys })
    });
    if (res.status === 404) throw new Error('not-set-up');
    if (!res.ok) throw new Error('failed');
    checkRequestedAt = Date.now();
    if (prices && prices.running) delete prices.running;   // an old unfinished check shouldn't show as current
    updateCheckBar();
  } catch (e) {
    updateCheckBar();
    toast(e.message === 'not-set-up' ? 'Check now needs a one-time setup. Until then, rows update at the 6 AM check.' : 'Couldn\'t start the check. Try again in a minute.');
  }
}

function downloadBackup() {
  const blob = new Blob([JSON.stringify({ products, savedAt: new Date().toISOString() }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `picksheet-products-${stamp()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function restoreBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async () => {
    try {
      const data = JSON.parse(await input.files[0].text());
      const list = (Array.isArray(data) ? data : data.products || []).filter(x => x && typeof x === 'object').map(cleanProduct);
      if (!list.length) throw new Error('empty');
      products = list;
      saveProducts();
      renderSetup();
      toast(`Restored ${plural(list.length, 'product')}`);
    } catch (e) { toast('That file isn\'t a picksheet backup.'); }
  };
  input.click();
}

// ============================================================
//  SHEETS AND TOASTS
// ============================================================
function openSheet(html) {
  const root = $('modal-root');
  root.innerHTML = `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const bd = root.firstElementChild;
  bd.addEventListener('click', e => { if (e.target === bd) closeSheet(); });
  return bd.firstElementChild;
}
function closeSheet() { $('modal-root').innerHTML = ''; }

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

// ============================================================
//  START
// ============================================================
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));

initFirebase();
loadQty();
loadProducts();
loadPrices();
render();
</script>
